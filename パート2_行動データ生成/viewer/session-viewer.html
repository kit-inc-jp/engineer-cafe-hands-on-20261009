<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="light">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>行動ログビューア</title>
<style>
/* layout: 上に人物カード＋概要。下は「行動の目次（左・細い）」と「選んだ行動：理由＋そのとき見ていたページの再現＋状態（右・広い）」 */
:root{
  --bg:#f3f5f6;--panel:#ffffff;--ink:#1d2a33;--muted:#5d6b75;--line:#d9e0e4;
  --accent:#1f5f8b;--accent-soft:#e3eef6;--buy:#8a5a12;--buy-soft:#fbefd9;--warn:#a3392b;--warn-soft:#fbe6e2;--code:#eef2f4;--page:#fbfbfa;
  --font-body:"Yu Gothic UI","Hiragino Sans","Meiryo",system-ui,sans-serif;
  --font-read:"Yu Mincho","Hiragino Mincho ProN","Noto Serif JP",serif;
  --font-mono:ui-monospace,Consolas,"BIZ UDGothic",monospace;
  color-scheme:light;
}
/* 配色は明るい色に固定（OS・ブラウザのダークモードでも同じ見た目にする） */
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.7 var(--font-body)}
main{max-width:1240px;margin:0 auto;padding-inline:16px;padding-block:32px 48px}
@media(min-width:760px){main{padding-inline:32px}}
h1{font-size:clamp(24px,3.6vw,34px);line-height:1.35;margin:4px 0 8px;font-weight:700;text-wrap:balance}
h2{font-size:18px;margin:0;font-weight:700;text-wrap:balance}
h3{font-size:13px;margin:0 0 6px;color:var(--muted);font-weight:600;letter-spacing:.04em}
p{margin:0}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.eyebrow{font-size:12px;letter-spacing:.14em;color:var(--muted)}
.small{font-size:12px;color:var(--muted)}
.mono{font-family:var(--font-mono);font-size:12px;overflow-wrap:anywhere}
.lead{color:var(--muted);max-width:68ch}
.stack{display:grid;gap:24px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:20px}
details>summary{cursor:pointer;color:var(--accent);font-size:13px}
/* 人物 */
.nickname{font-size:16px;font-weight:700;margin-top:10px}
.persona{color:var(--muted);max-width:68ch;margin-top:6px}
.profile{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px 24px;margin-top:14px}
.kv{min-width:0}
.kv ul{margin:0;padding-left:18px}
.kv p,.kv li{overflow-wrap:anywhere}
/* 概要 */
.overview{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.badge{padding:4px 12px;border-radius:999px;background:var(--accent-soft);font-size:13px;font-variant-numeric:tabular-nums}
.badge.buy{background:var(--buy-soft);color:var(--buy)}
.badge.warn{background:var(--warn-soft);color:var(--warn)}
.files{padding:16px 20px}
.slots{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr));gap:12px 20px}
.slot{min-width:0;border:1px dashed var(--line);border-radius:10px;padding:10px 12px;transition:background .15s,border-color .15s}
.slot.drop{border-color:var(--accent);background:var(--accent-soft);outline:none}
.drop-hint{font-size:11px;color:var(--muted);margin:0}
.slot label{font-size:13px}
.slot .small{overflow-wrap:anywhere}
.problems{border-color:var(--warn)}
.problems h2{color:var(--warn)}
.problem-list{margin:12px 0 0;padding-left:22px;display:grid;gap:10px;font-size:13px}
.problem-list li{overflow-wrap:anywhere}
.problem-list .where{font-weight:700;margin-right:6px}
.problem-list .lv{display:inline-block;font-size:11px;padding:0 6px;border-radius:4px;margin-right:6px;background:var(--warn-soft);color:var(--warn)}
.problem-list .lv.minor{background:var(--code);color:var(--muted)}
.problem-list .fix{display:block;color:var(--muted);margin-top:2px}
.problem-list .fix::before{content:"直し方：";font-weight:600;color:var(--ink)}
/* 左：行動の目次 */
.layout{display:grid;grid-template-columns:minmax(0,340px) minmax(0,1fr);gap:24px;align-items:start}
.flow{list-style:none;margin:10px 0 0;padding:0}
.step{position:relative;padding:0 0 6px 34px}
.step:not(:last-child)::before{content:"";position:absolute;left:11px;top:22px;bottom:-6px;width:1px;background:var(--line)}
.num{position:absolute;left:0;top:9px;width:23px;height:23px;border-radius:50%;display:grid;place-items:center;font-size:11px;background:var(--panel);border:1px solid var(--line);font-variant-numeric:tabular-nums}
.step.active .num{background:var(--accent);border-color:var(--accent);color:var(--panel)}
.step.kind-buy .num{border-color:var(--buy);color:var(--buy)}
.step.kind-buy.active .num{background:var(--buy);color:var(--panel)}
.step-btn{display:block;width:100%;text-align:left;background:transparent;border:1px solid transparent;border-radius:8px;padding:6px 10px}
.step-btn:hover{background:var(--panel);border-color:var(--line)}
.step-btn[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent)}
.step-top{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.step-title{font-weight:700;font-size:14px}
.time{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.step-sub{display:block;font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mark{display:inline-block;font-size:11px;padding:0 6px;border-radius:4px;margin-left:4px;vertical-align:1px;background:var(--code);color:var(--muted);font-weight:400}
.mark.buy{background:var(--buy-soft);color:var(--buy)}
.mark.warn{background:var(--warn-soft);color:var(--warn)}
.gap{display:block;font-size:10px;color:var(--muted);padding:0 0 0 10px;font-variant-numeric:tabular-nums}
/* 右：詳細 */
.detail{position:sticky;top:16px;max-height:calc(100vh - 32px);overflow:auto;display:grid;gap:16px}
.d-label{font-size:12px;color:var(--accent);font-weight:600;font-variant-numeric:tabular-nums}
.reason{margin:0;font-size:16px;line-height:1.9;padding:12px 16px;border-left:3px solid var(--accent);background:var(--accent-soft);border-radius:0 8px 8px 0;overflow-wrap:anywhere}
.frame{border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--page)}
.addr{display:flex;gap:8px;align-items:center;padding:6px 12px;border-bottom:1px solid var(--line);background:var(--code)}
.addr .dots{display:flex;gap:4px}.addr .dots i{width:8px;height:8px;border-radius:50%;background:var(--line);display:block}
.addr .mono{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.page{padding:18px;display:grid;gap:14px;min-width:0}
.action{justify-self:start;font-size:13px;padding:4px 12px;border-radius:999px;background:var(--buy-soft);color:var(--buy);font-weight:600}
.action.info{background:var(--accent-soft);color:var(--accent)}
.crumbs{font-size:12px;color:var(--muted)}
.prod{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr));gap:18px}
.prod>*{min-width:0}
.gallery{display:grid;gap:6px;min-width:0}
.thumbs{display:flex;gap:6px;overflow-x:auto}
.thumbs img,.thumbs .noimg{width:52px;height:52px;flex:none}
.pimg{width:100%;aspect-ratio:1/1;max-width:100%;object-fit:cover;border-radius:8px;background:var(--code);display:block}
.noimg{display:grid;place-items:center;aspect-ratio:1/1;max-width:100%;border-radius:8px;background:var(--code);color:var(--muted);font-size:11px;text-align:center;padding:6px;overflow:hidden}
.pname{font-size:18px;font-weight:700;line-height:1.5}
.pprice{font-size:22px;font-weight:700;font-variant-numeric:tabular-nums}
.pprice small{font-size:12px;font-weight:400;color:var(--muted);margin-left:6px}
.desc{font-size:14px;line-height:1.85}
.specs{width:100%;border-collapse:collapse;font-size:12px}
.specs th,.specs td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line);vertical-align:top;overflow-wrap:anywhere}
.specs th{color:var(--muted);font-weight:600}
.specs tr.sel td{background:var(--accent-soft);font-weight:600}
.article{font-family:var(--font-read);font-size:15px;line-height:2;max-width:42em}
.article h2{font-family:var(--font-body);font-size:17px;margin:20px 0 6px}
.article p{margin:0 0 10px}
.article img,.article .noimg{width:100%;max-width:100%;border-radius:8px;margin:6px 0 12px;display:block}
.article img{height:auto}
.article .noimg{aspect-ratio:16/7}
.article ul{padding-left:20px}
.atitle{font-size:20px;font-weight:700;line-height:1.5;text-wrap:balance}
.linkcard{display:flex;gap:10px;align-items:center;border:1px solid var(--line);border-radius:8px;padding:8px;font-size:13px;background:var(--panel)}
.linkcard .pimg,.linkcard .noimg{width:56px;flex:none}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:12px}
.card{font-size:12px;display:grid;gap:4px;align-content:start}
.card.hit{outline:2px solid var(--buy);outline-offset:3px;border-radius:6px}
.chips-row{display:flex;flex-wrap:wrap;gap:6px}
.cat-chip{font-size:12px;padding:3px 10px;border:1px solid var(--line);border-radius:999px;background:var(--panel)}
.cat-chip.hit{border-color:var(--buy);background:var(--buy-soft);color:var(--buy);font-weight:600}
.cat-group{display:grid;gap:6px}
.rowlist{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.rowlist li{display:grid;grid-template-columns:72px minmax(0,1fr);gap:12px;align-items:start;padding:8px;border-radius:8px}
.rowlist.plain li{grid-template-columns:minmax(0,1fr);border-bottom:1px solid var(--line);border-radius:0}
.rowlist li.hit{outline:2px solid var(--buy);outline-offset:-2px;border-radius:8px}
.rowlist .thumb{width:72px;height:72px;object-fit:cover;border-radius:6px;background:var(--code);display:block}
.rowlist .noimg.thumb{font-size:10px;aspect-ratio:auto;height:72px}
.row-title{font-weight:600;font-size:14px;line-height:1.6;overflow-wrap:anywhere}
.row-title .mark{margin-left:6px}
.row-sub{font-size:12px;color:var(--muted);line-height:1.7}
.card b{font-variant-numeric:tabular-nums}
.lines{width:100%;border-collapse:collapse;font-size:13px}
.lines th,.lines td{padding:8px 6px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top;overflow-wrap:anywhere}
.lines th{color:var(--muted);font-weight:600;font-size:12px}
.lines .n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.params{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 12px;font-size:13px;margin:0}
.params dt{color:var(--muted)}
.params dd{margin:0;overflow-wrap:anywhere}
.hint{font-size:12px;color:var(--muted)}
.state{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.state>div{min-width:0;border-top:1px solid var(--line);padding-top:10px}
.item{margin:4px 0;font-size:13px}
.item-name{font-weight:600;overflow-wrap:anywhere}
.total{font-size:12px;margin-top:4px;font-variant-numeric:tabular-nums;color:var(--muted)}
.empty{color:var(--muted);font-size:13px}
pre{background:var(--code);border-radius:8px;padding:12px;margin:8px 0 0;white-space:pre-wrap;overflow-wrap:anywhere;font:12px/1.6 var(--font-mono);max-height:420px;overflow:auto}
/* 入力 */
label{font-weight:600;display:block}
input[type=file]{display:block;max-width:100%;margin:6px 0;font-size:12px}
textarea{width:100%;min-height:150px;padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--code);font:12px/1.6 var(--font-mono);resize:vertical}
.controls{display:flex;flex-wrap:wrap;gap:10px;margin-top:12px}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:8px 14px;min-height:40px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--panel)}
.btn:disabled{opacity:.5;cursor:default}
.drop{outline:2px dashed var(--accent);outline-offset:4px}
#error{color:var(--warn);white-space:pre-wrap;margin-top:10px;font-size:13px}
@media(max-width:860px){.layout{grid-template-columns:1fr}.detail{position:static;max-height:none;overflow:visible}}
@media(prefers-reduced-motion:no-preference){.step-btn{transition:border-color .15s,background .15s}}
</style>
</head>
<body>
<main id="app">
  <header>
    <p class="eyebrow">仮想ユーザー行動ログ / 1 SESSION</p>
    <h1 id="title">行動ログビューア</h1>
    <p class="lead">user.json と events.json を読み込むと、行動の流れを表示します。</p>
  </header>

  <div class="stack" style="margin-top:24px">
    <section id="input-area" class="panel files" aria-label="読み込むファイル">
      <div class="slots">
        <div class="slot" id="slot-user"><label for="user-file">ユーザー情報（user.json）</label><p class="drop-hint">ここにドロップ（ファイル名は問いません）</p><input id="user-file" type="file" accept=".json,application/json"><p id="user-status" class="small"></p></div>
        <div class="slot" id="slot-events"><label for="events-file">行動ログ（events.json）</label><p class="drop-hint">ここにドロップ（ファイル名は問いません）</p><input id="events-file" type="file" accept=".json,.jsonl,application/json"><p id="events-status" class="small"></p></div>
      </div>
    </section>

    <section id="problems" class="panel problems" role="alert" hidden aria-labelledby="problems-title">
      <h2 id="problems-title"></h2>
      <p id="problems-lead" class="small" style="margin-top:4px"></p>
      <ol id="problem-list" class="problem-list"></ol>
      <div class="controls">
        <button id="copy-fix" class="btn primary" type="button">AIへの修正依頼文をコピー</button>
        <span id="copy-status" class="small" style="align-self:center" role="status"></span>
      </div>
      <details id="fix-box" style="margin-top:10px"><summary>修正依頼文を見る</summary><textarea id="fix-text" readonly spellcheck="false" style="min-height:220px;margin-top:8px"></textarea></details>
    </section>

    <section id="result" class="stack" hidden>
      <section class="panel" aria-labelledby="profile-title">
        <h2 id="profile-title">ユーザー情報</h2>
        <p id="nickname" class="nickname" hidden></p>
        <p id="persona" class="persona"></p>
        <div id="profile" class="profile"></div>
      </section>

      <div id="overview" class="overview" aria-label="セッションの概要"></div>

      <div class="layout">
        <nav aria-labelledby="flow-title">
          <div style="display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px;align-items:baseline">
            <h2 id="flow-title">行動の流れ</h2><span id="tz" class="small"></span>
          </div>
          <ol id="flow" class="flow"></ol>
        </nav>
        <section id="detail" class="panel detail" aria-live="polite" aria-labelledby="d-title">
          <div><p id="d-label" class="d-label"></p><h2 id="d-title"></h2></div>
          <blockquote id="d-reason" class="reason"></blockquote>
          <div class="frame" aria-label="このとき見ていたページ">
            <div class="addr"><span class="dots" aria-hidden="true"><i></i><i></i><i></i></span><span id="d-path" class="mono"></span></div>
            <div id="d-page" class="page"></div>
          </div>
          <div class="state">
            <div><h3>この行動の直後のカート</h3><div id="d-cart"></div></div>
            <div id="d-wish-box"><h3>お気に入り</h3><div id="d-wish"></div></div>
            <div><h3>この時点までの購入</h3><div id="d-bought"></div></div>
          </div>
          <details><summary>この行動のログ（JSON）</summary><pre id="d-raw"></pre></details>
        </section>
      </div>
    </section>
  </div>
</main>

<!-- ③の手順で、次の1行を {"user": user.jsonの中身, "events": events.jsonの中身} に置き換える -->
<!-- ページ再現用のECデータ。file:// で開いても読めるよう、同じフォルダの ec-data.js を script で読み込む -->
<script src="ec-data.js"></script>
<script id="session-data" type="application/json">
{"user": null, "events": []}
</script>

<script>
(() => {
'use strict';
const $ = id => document.getElementById(id);
const fmt = n => new Intl.NumberFormat('ja-JP').format(n);

const LABELS = {
  view_top:'トップを見る', view_category_list:'カテゴリ一覧を見る', filter_items:'カテゴリで絞り込む', sort_items:'並べ替える',
  search:'キーワード検索', view_item_list:'商品一覧を見る', view_item:'商品詳細を見る', add_to_cart:'カートに入れる',
  remove_from_cart:'カートから削除', add_to_wishlist:'お気に入りに追加', view_wishlist:'お気に入りを見る', view_cart:'カートを見る',
  begin_checkout:'購入手続きへ', purchase:'注文を確定', view_blog_list:'ブログ一覧を見る', view_article:'ブログ記事を読む',
  view_news_list:'お知らせ一覧を見る', view_news:'お知らせを読む', leave_site:'サイトを離れる'
};
const ITEM = ['item_id','item_name','price','tax_rate_percent','spec_id'];
const REQUIRED = {
  view_top:['path'], view_category_list:['path'], filter_items:['path','filter_type','filter_value'], sort_items:['path','sort_type'],
  search:['path','search_term'], view_item_list:['path','items'], view_item:['path',...ITEM], add_to_cart:['path',...ITEM,'quantity'],
  remove_from_cart:['path',...ITEM,'quantity'], add_to_wishlist:['path',...ITEM], view_wishlist:['path','items'], view_cart:['path','items'],
  begin_checkout:['path','items'], purchase:['path','transaction_id','items','shipping_address'], view_blog_list:['path'],
  view_article:['path','article_id','article_title'], view_news_list:['path'], view_news:['path','news_id','news_title'], leave_site:['path']
};
const OPTIONAL = ['category1','category2','category3'];
const SORTS = {price_low_to_high:'価格の安い順', price_high_to_low:'価格の高い順', newest:'新着順'};
const PROFILE_LABELS = [['age_group','年代'],['household','暮らし方'],['occupation','仕事・日中'],['shopping_goal','今回の目的'],
  ['purchase_intent','購入の意向'],['budget_feel','予算感'],['decision_criteria','重視すること'],['habits','くせ・サイトとの関係'],['constraints','避けたいこと・制約']];

let model = null, selected = 0;
// ECデータ（ページ再現用）。source: embedded / fetch / files
let ec = null;

const el = (tag, text, cls) => { const n = document.createElement(tag); if (text != null) n.textContent = text; if (cls) n.className = cls; return n; };
const toDate = ts => new Date(ts.replace(' ', 'T') + 'Z');
const key = it => it.item_id + '#' + it.spec_id;
const qty = list => list.reduce((s, x) => s + (x.quantity || 0), 0);
const sum = list => list.reduce((s, x) => s + x.price * (x.quantity || 0), 0);
const dur = sec => { const m = Math.floor(sec / 60), s = sec % 60, h = Math.floor(m / 60); return (h ? h + '時間' : '') + (m % 60 ? (m % 60) + '分' : '') + (s || (!h && !(m % 60)) ? s + '秒' : ''); };
const pick = p => ({item_id: p.item_id, item_name: p.item_name, price: p.price, tax_rate_percent: p.tax_rate_percent, spec_id: p.spec_id});

/* ---------- ECデータ ---------- */
// 行動ログの item_id は商品番号（1〜604）。product.json・product-light.json とも product_id がこの番号。
// 古い形式の product.json（product_id が長いID）の場合は商品名で番号（_short）を対応づける。product.json が無ければ product-light.json だけで組み立てる
function makeEc(products, blogs, news, source, light, categories) {
  let list = products || [];
  if (!list.length && light && light.length) list = light.map(l => ({
    product_id: 'light-' + l.product_id, product_name: l.product_name, price: l.price, detailed_description: l.detailed_description,
    categories: (l.categories || []).map(name => ({category_name: name})), is_reduced_tax_rate: (l.categories || [])[0] === '食品',
    product_specifications: [{spec_id: 1, price: null}], _short: l.product_id
  }));
  const shortByName = light && light.length ? new Map(light.map(l => [l.product_name, l.product_id])) : null;
  list.forEach((p, i) => { if (p._short == null) p._short = Number.isInteger(p.product_id) ? p.product_id : shortByName ? shortByName.get(p.product_name) : i + 1; });
  return {
    products: new Map(list.map(p => [p.product_id, p])),
    byShort: new Map(list.filter(p => p._short != null).map(p => [Number(p._short), p])),
    blogs: new Map((blogs || []).map(b => [Number(b.blog_id), b])),
    news: new Map((news || []).map(n => [Number(n.id), n])),
    categories: categories || [],
    hasLight: !!(light && light.length) || source === 'embedded' || list.some(p => Number.isInteger(p.product_id)),
    raw: {products, blogs, news, light},
    source
  };
}
// 番号（行動ログの item_id、ブログ・お知らせの product_id）から商品を引く
function prodOf(id) {
  if (!ec || id == null) return null;
  if (/^\d+$/.test(String(id))) return ec.byShort.get(Number(id)) || null;

    items.forEach(it => {

    if (p.shipping_address && typeof p.shipping_address === 'object') {

    if (ec && ec.blogs.size && name === 'view_article' && p.article_id != null) { const b = ec.blogs.get(Number(p.article_id)); if (!b) add('warn', i, '記事ID ' + p.article_id + ' が blog.json にありません。', 'blog.json の blog_id を使ってください。'); else if (b.title !== p.article_title) add('warn', i, 'article_title が blog.json と違います。', '"' + b.title + '" にしてください。'); }

    const cartList = () => [...cart.values()];

      else { const left = c.quantity - (p.quantity || c.quantity); left > 0 ? cart.set(key(p), {...c, quantity: left}) : cart.delete(key(p)); }

      for (const it of items) {
        const c = cart.get(key(it));
        if (!c || c.quantity < it.quantity) add('warn', i, it.item_name + ' がカートにない、または数量が足りません。', '購入する商品は先に add_to_cart でカートに入れてください。');
        else c.quantity === it.quantity ? cart.delete(key(it)) : cart.set(key(it), {...c, quantity: c.quantity - it.quantity});

  if (lastName && lastName !== 'leave_site') add('warn', null, '最後の行動が leave_site（離脱）ではありません。', '最後に { "event_name": "leave_site", "event_params": { "path": 最後のページ } } を追加してください。出力が途中で切れていないかも確認してください。');
  if (user.user_id && events[0] && events[0].user_id != null && events[0].user_id !== user.user_id) add('warn', null, 'user.json の user_id「' + user.user_id + '」と行動ログの user_id が違います。', 'どちらかに合わせてください。');

  const grouped = groupIssues(issues, n);
  if (grouped.some(x => x.level === 'error')) throw new InputError(grouped);
  const end = states[states.length - 1];
  const outcome = end.bought.length ? '購入して離脱' : end.cart.length ? 'カートに残して離脱' : '購入なしで離脱';
  return {user, events, states, issues: grouped, tz, outcome};
}

// 同じ問題をまとめ、対象のイベント番号を「1〜3, 5件目」「全14件」の形にする
function groupIssues(issues, n) {
  const map = new Map();
  for (const x of issues) {
    const g = map.get(x.group);
    if (g) { if (x.idx != null && !g.idx.includes(x.idx)) g.idx.push(x.idx); }
    else map.set(x.group, {level: x.level, msg: x.msg, fix: x.fix, where: x.where, idx: x.idx != null ? [x.idx] : []});
  }
  const out = [...map.values()];
  for (const g of out) if (!g.where) g.where = g.idx.length ? rangeText(g.idx, n) : '全体';
  return out.sort((a, b) => (a.level === b.level ? 0 : a.level === 'error' ? -1 : 1));
}
function rangeText(idx, n) {
  const s = [...idx].sort((a, b) => a - b);
  if (s.length === n && n > 1) return '全' + n + '件';
  const parts = [];
  for (let i = 0; i < s.length; i++) {
    let j = i; while (j + 1 < s.length && s[j + 1] === s[j] + 1) j++;
    parts.push(j > i ? (s[i] + 1) + '〜' + (s[j] + 1) : String(s[i] + 1)); i = j;
  }
  return parts.join(', ') + '件目';
}

// Web版のAIなどに、そのまま貼って修正してもらうための依頼文
const FORMAT_SPEC = `- 全体はイベントの JSON 配列。1件の形：
  {"user_id": "…", "timestamp": "YYYY-MM-DD HH:mm:ss（UTC。T・Z・+09:00は付けない）", "site_activities": {"event_name": "…", "event_params": {…}}, "reason_for_the_action": "行動の理由"}
- イベントの直下に置けるのは user_id, timestamp, site_activities, reason_for_the_action だけ。
- 「単一商品」= item_id（product-light.json の product_id。1〜604の整数で、""で囲まない）, item_name（product_name）, price（税抜単価 = floor(税込×100÷(100+税率))）, tax_rate_percent（categories の1つ目が「食品」なら8、それ以外は10）, spec_id（常に 1）
- イベント名と event_params の必須項目（これ以外の項目は入れない）：
  view_top: path / view_category_list: path / filter_items: path（/items?category[]={ID}）, filter_type（"category"）, filter_value（IDの文字列）
  sort_items: path, sort_type（price_low_to_high か price_high_to_low） / search: path（/items?q={語}）, search_term
  view_item: path（/items/{item_id}。例：/items/464）, 単一商品 / add_to_cart: path, 単一商品, quantity / remove_from_cart: path（/cart）, 単一商品, quantity
  add_to_wishlist: path, 単一商品 / view_wishlist: path, items（各要素は単一商品）
  view_cart: path（/cart）, items / begin_checkout: path（/checkout）, items / purchase: path（/checkout/complete）, transaction_id, items, shipping_address
  （items の各要素 = 単一商品 + quantity。その時点のカート全体と一致させる）
  view_blog_list: path（/blogs） / view_article: path（/blogs/{blog_id}）, article_id, article_title
  view_news_list: path（/news） / view_news: path（/news/{id}）, news_id, news_title / leave_site: path（最後のページ）
- shipping_address は {"label": "自宅", "prefecture": "東京都", "postal_code": "100-0000", "address1": "千代田区架空町1-2-3", "address2": null} をそのまま使う。
- 最後の1件だけ leave_site。時刻は古い順で同じ時刻を作らない。全件の user_id を同じにする。`;
function fixRequest(issues, label, sourceText) {
  const list = issues.map((x, i) => (i + 1) + '. 【' + x.where + '】' + x.msg + '\n   直し方：' + x.fix).join('\n');
  return '次の' + label + 'を、決められた形式に合わせて直してください。\n'
    + '「見つかった問題」をすべて直し、直した JSON 全体を1つのコードブロックで出力してください。省略せず最後のイベントまで出力してください。\n'
    + '商品の item_id・item_name・価格・税率は product-light.json の実在の値を使い、推測で作らないでください。product-light.json を参照できない場合は、その旨を伝えてください。\n\n'
    + '## 見つかった問題（' + issues.length + '種類）\n' + list + '\n\n'
    + '## 正しい形式\n' + FORMAT_SPEC + '\n\n'
    + '## 直す対象の' + label + '\n' + String(sourceText || '').trim() + '\n';
}

function fmtTime(ts, withDate) {
  const o = {timeZone: model.tz, hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false};
  if (withDate) Object.assign(o, {year: 'numeric', month: 'long', day: 'numeric', weekday: 'short'});
  try { return new Intl.DateTimeFormat('ja-JP', o).format(toDate(ts)); } catch { return ts + ' UTC'; }
}

      children: ec.categories.filter(c => c.parent_category_id === t.category_id).map(c => ({id: c.category_id, name: c.category_name}))}));
  }

  }

// ドロップされたものを、イベント中に同期的に取り出す（イベントが終わると dataTransfer は読めなくなる）
function grabDrop(dt) {
  const items = [...(dt.items || [])].filter(it => it.kind === 'file');
  return {
    text: dt.getData('text/plain'),
    files: [...dt.files],
    entries: items.map(it => (it.webkitGetAsEntry ? it.webkitGetAsEntry() : null)),
    // 新しいフォルダ読み取り方式（Chrome・Edge）。file:// で開いた時も使える場合がある
    handles: items.map(it => (it.getAsFileSystemHandle ? it.getAsFileSystemHandle().catch(() => null) : Promise.resolve(null)))
  };
}
// フォルダは中のファイルまで集める。新しい方式 → 古い方式の順に試し、両方だめなら理由を返す
async function collectFiles(g) {
  const hasDir = g.entries.some(en => en && en.isDirectory);
  const handles = await Promise.all(g.handles);
  if (!hasDir && !handles.some(h => h && h.kind === 'directory')) return {files: g.files};
  const errors = [];
  if (handles.some(h => h)) {
    try {
      const out = [];
      const walk = async h => { if (h.kind === 'file') out.push(await h.getFile()); else for await (const c of h.values()) await walk(c); };
      for (const h of handles) if (h) await walk(h);
      return {files: out};
    } catch (e) { errors.push(e.name || e.message); }
  }
  try {
    const out = [];
    const walk = async en => {
      if (en.isFile) { out.push(await new Promise((res, rej) => en.file(res, rej))); return; }
      const reader = en.createReader();
      for (;;) { const batch = await new Promise((res, rej) => reader.readEntries(res, rej)); if (!batch.length) break; for (const c of batch) await walk(c); }
    };
    for (const en of g.entries) if (en) await walk(en);
    return {files: out};
  } catch (e) { errors.push(e.name || e.message); }
  return {files: [], folderError: errors.join(' / ') || '不明'};
}
// ドロップ先の見た目。子要素の出入りで消えないよう、枠の外へ出た時だけ外す
function dropZone(node, onDrop, statusId) {
  node.addEventListener('dragover', e => { e.preventDefault(); e.stopPropagation(); e.dataTransfer.dropEffect = 'copy'; node.classList.add('drop'); });
  node.addEventListener('dragleave', e => { if (!node.contains(e.relatedTarget)) node.classList.remove('drop'); });
  node.addEventListener('drop', async e => {
    e.preventDefault(); e.stopPropagation(); node.classList.remove('drop');
    const g = grabDrop(e.dataTransfer);
    try {
      const {files, folderError} = await collectFiles(g);
      if (folderError) { $(statusId).textContent = 'フォルダの中身をブラウザが読み取れませんでした（' + folderError + '）。data フォルダを開いて中のファイルをすべて選択し、この欄に置いてください。「ファイルを選択」から data フォルダを選ぶ方法でも読み込めます。'; return; }
      await onDrop(files, g.text);
    } catch (err) { $(statusId).textContent = '置いたものを読み取れませんでした（' + err.message + '）。「ファイルを選択」から選んでください。'; }
  });
}
// 各欄：置いた欄のデータとして読み込む（ファイル名は問わない。チャットで選択したJSONのテキストも可）
for (const kind of ['user', 'events']) dropZone($('slot-' + kind), async (files, text) => {

    const isUser = v ? (!Array.isArray(v) && !Array.isArray(v.events)) : /user/i.test(name || '');
    if (isUser) user = [t, name]; else events = [t, name];

    sort(await f.text(), f.name);
  }
  if (!files.length && text.trim()) sort(text, '');
  if (user) { inputs.user = user[0]; fileNames.user = user[1]; }
  if (events) { inputs.events = events[0]; fileNames.events = events[1]; }

  }
  if (data && data.pages) ec = makeEc(data.pages.products, data.pages.blogs, data.pages.news, 'embedded', null, data.pages.categories);
  else if (window.EC_DATA) ec = makeEc(window.EC_DATA.products, window.EC_DATA.blogs, window.EC_DATA.news, 'bundled', null, window.EC_DATA.categories);
  setFileStatus();
  if (data && Array.isArray(data.events) && data.events.length) {
    inputs.user = JSON.stringify(data.user || {}, null, 2);
    inputs.events = JSON.stringify(data.events, null, 2);
    apply(false);
  }
})();
})();
</script>
